version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Bratislava
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
    labels:
      - 'dependencies'
      - 'kind:chore'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - 'dependencies'
      - 'kind:ci'
