name: Lint + Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Biome CI check
        run: pnpm exec biome ci .

  cycles:
    name: Dependency cycle check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect circular dependencies
        run: pnpm exec madge --circular --extensions ts,tsx packages apps

  runtime-data-guard:
    name: Runtime data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid runtime data in apps/web/public/
        run: |
          if find apps/web/public/cache apps/web/public/manifests apps/web/public/reports 2>/dev/null | grep -q .; then
            echo "::error::Runtime data committed to apps/web/public/ — see CLAUDE.md rule 6"
            exit 1
          fi

  reference-tag-guard:
    name: Reference-tag comment guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Forbid US-/GATE-/EPIC- comment tags (CLAUDE.md rule 2)
        run: node scripts/lint-comments.mjs

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: pnpm exec commitlint --from origin/main --to HEAD --verbose
